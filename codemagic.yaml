# Codemagic CI. Two workflows, both on macOS runners because both need Xcode:
# the host app's macOS injector is cgo against CoreGraphics, and the phone
# app's tunnel is a gomobile framework, which only binds with the iOS SDK.
#
# Nothing here is signed by default. `ios` proves the app compiles — the Go
# bridging and strict concurrency included — and `host` produces the tray app
# for macOS and Windows. To put a build on TestFlight, run the `ios-signed`
# workflow at the bottom by hand; it needs an App Store Connect key registered
# in Codemagic and the app record created in App Store Connect first.

definitions:
  triggering: &on_push
    events:
      - push
      - pull_request
    branch_patterns:
      - pattern: main
        include: true
        source: true
    cancel_previous_builds: true

  go_cache: &go_cache
    cache_paths:
      - $HOME/go/pkg/mod
      - $HOME/Library/Caches/go-build

  install_go: &install_go
    name: Install Go
    script: |
      brew install go
      # go.mod pins a toolchain; GOTOOLCHAIN=auto fetches it if brew's is older.
      go version

workflows:
  host:
    name: Host app
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Every build signs with the Developer ID certificate and notarises, so
    # any artifact opens on anyone's Mac without a Gatekeeper override. Only
    # when the certificate is absent — a fork's pull request, or before the
    # variable is set — does it fall back to ad-hoc.
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    cache: *go_cache
    # The App Store Connect key doubles as the notarisation credential.
    integrations:
      app_store_connect: awmouse
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - *install_go
      - name: Install the Windows cross-compiler
        # The host is a Fyne app, and Fyne needs cgo on every platform. The
        # injector alone was pure Go on Windows; the GUI is not.
        script: brew install mingw-w64
      - name: Vet and test
        working_directory: host
        script: |
          go vet ./...
          # The real-cursor test skips itself: CI has no Accessibility grant.
          # The tailcat tests run a relay on loopback and need no network.
          go test ./... -count=1
      - name: Package for macOS
        working_directory: host
        script: |
          if [ -z "${DEVELOPER_ID_P12:-}" ]; then
            # No certificate on hand: ad-hoc. Opens after a Gatekeeper
            # override; fine for testers, not for strangers.
            echo "DEVELOPER_ID_P12 not set; ad-hoc signing"
            make app zip
            exit 0
          fi

          # Sign with the Developer ID certificate and notarise.
          #
          # The certificate is a .p12 exported once from Xcode and stored,
          # base64-encoded, as the secure variable DEVELOPER_ID_P12 (with its
          # password in DEVELOPER_ID_P12_PASSWORD) in the "signing" group.
          # Developer ID certificates can only be created by the account
          # holder, and not through the API, so this one step is manual.
          echo "$DEVELOPER_ID_P12" | base64 --decode > /tmp/devid.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/devid.p12 \
            --certificate-password "@env:DEVELOPER_ID_P12_PASSWORD"
          rm /tmp/devid.p12

          identity=$(security find-identity -v -p codesigning \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "DEVELOPER_ID_P12 imported, but no 'Developer ID Application' identity found"
            exit 1
          fi
          echo "signing as: $identity"

          # notarytool wants the API key as a PEM file, and the integration
          # hands it over as an environment variable whose exact shape has
          # varied: real newlines, literal backslash-n, header and footer
          # present or stripped, or the whole thing base64-wrapped. Try each
          # reading and keep the first that openssl accepts, so the step does
          # not depend on which one Codemagic happens to use today. If none
          # works, say what the value looked like — its length and first
          # twelve characters, which for any of these forms is a constant
          # header or DER prefix, not key material.
          mkdir -p "$HOME/.private_keys"
          p8="$HOME/.private_keys/AuthKey.p8"
          raw="$APP_STORE_CONNECT_PRIVATE_KEY"
          valid() { openssl pkey -in "$p8" -noout 2>/dev/null; }

          # 0. A reference, not the key: the integration writes the key to
          #    disk and hands over "@file:/path" (or "@env:NAME") in the
          #    codemagic-cli-tools convention. Follow it.
          case "$raw" in
            @file:*) cp "${raw#@file:}" "$p8" ;;
            @env:*)  raw=$(printenv "${raw#@env:}") ; printf '%b\n' "$raw" > "$p8" ;;
            *)       printf '%b\n' "$raw" > "$p8" ;;
          esac
          # 1. (fallthrough) As given, with backslash-n expanded — done above.
          if ! valid; then
            # 2. Header and footer missing: it is the bare base64 body.
            body=$(printf '%b' "$raw" | tr -d '\n\r ' )
            { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$p8"
          fi
          if ! valid; then
            # 3. The PEM itself, base64-wrapped.
            printf '%s' "$raw" | tr -d '\n\r ' | base64 --decode > "$p8" 2>/dev/null || true
          fi
          if ! valid; then
            echo "APP_STORE_CONNECT_PRIVATE_KEY could not be read as a private key"
            echo "length=${#raw} first12=$(printf '%s' "$raw" | head -c 12) newlines=$(printf '%s' "$raw" | tr -cd '\n' | wc -c | tr -d ' ') backslashes=$(printf '%s' "$raw" | tr -cd '\\' | wc -c | tr -d ' ')"
            exit 1
          fi
          echo "API key: valid PEM ($(wc -l < "$p8" | tr -d ' ') lines)"

          make app SIGN_IDENTITY="$identity"
          make notarize \
            NOTARY_KEY="$HOME/.private_keys/AuthKey.p8" \
            NOTARY_KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            NOTARY_ISSUER="$APP_STORE_CONNECT_ISSUER_ID"
      - name: Cross-compile for Windows
        working_directory: host
        script: make windows
      - name: Phone package portability check
        working_directory: host
        script: |
          CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build ./mobile/...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./mobile/...
    artifacts:
      - host/dist/awmouse-macos.zip
      - host/dist/awmouse-win.zip

  ios:
    name: iOS app (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering: *on_push
    cache:
      cache_paths:
        - $HOME/go/pkg/mod
        - $HOME/Library/Caches/go-build
        - $HOME/Library/Caches/org.swift.swiftpm
    environment:
      xcode: latest
    scripts:
      - *install_go
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Test MotionInput
        working_directory: shared/MotionInput
        script: swift test
      - name: Bind the tunnel and generate the project
        working_directory: ios
        script: make project
      - name: Build for device, unsigned
        working_directory: ios
        script: |
          xcodebuild build \
            -project awmouse.xcodeproj \
            -scheme awmouse \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || exit ${PIPESTATUS[0]}
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

  # Puts a build on TestFlight. Before this can run:
  #   1. Codemagic › Teams › Integrations › App Store Connect: add an API key
  #      with the Admin or App Manager role — Developer cannot create the
  #      distribution certificate — and name it "awmouse" (or change
  #      `app_store_connect` below).
  #   2. Create the app record in App Store Connect for the bundle id.
  #      `--create` registers the bundle id in the developer portal, but the
  #      App Store Connect record is separate, and the upload fails without it.
  #   3. Codemagic › Environment variables: group "signing", variable
  #      CERTIFICATE_PRIVATE_KEY (secure), holding an RSA key made with
  #      `openssl genrsa 2048`. The certificate is issued against this key,
  #      so it must be the same key every run — a fresh one per build would
  #      mint a new certificate each time and hit Apple's limit.
  # fetch-signing-files then creates the bundle id, certificate and profile
  # as needed, and `use-profiles` writes team and profile into the freshly
  # generated project — so Local.xcconfig can stay empty here too.
  ios-signed:
    name: iOS app (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Runs on a version tag, or by hand. Not on push: signing assets are not
    # something every commit should touch, and every run that reaches the end
    # lands a build in TestFlight. A release is `git tag v0.2 && git push
    # --tags`, after MARKETING_VERSION in ios/project.yml says 0.2 — the
    # first step refuses a tag that disagrees with the project.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: false
    cache:
      cache_paths:
        - $HOME/go/pkg/mod
        - $HOME/Library/Caches/go-build
        - $HOME/Library/Caches/org.swift.swiftpm
    integrations:
      app_store_connect: awmouse
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Check the tag matches the project version
        script: |
          # Only on tag builds; a manual run has no tag to check.
          if [ -z "${CM_TAG:-}" ]; then echo "manual run; skipping"; exit 0; fi
          version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' ios/project.yml | head -1)
          if [ "v$version" != "$CM_TAG" ]; then
            echo "tag $CM_TAG does not match MARKETING_VERSION $version in ios/project.yml"
            echo "bump the project version first, then tag"
            exit 1
          fi
          echo "releasing $version"
      - name: Fetch or create signing files
        script: |
          # App Store distribution, not development: TestFlight accepts nothing
          # else. Creating the distribution certificate needs the API key to
          # hold the Admin or App Manager role — Developer is not enough.
          app-store-connect fetch-signing-files "space.keybo.awmouse" --type IOS_APP_STORE --platform IOS --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain initialize
          keychain add-certificates
      - *install_go
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Bind the tunnel and generate the project
        working_directory: ios
        script: make project
      - name: Apply signing to the generated project
        working_directory: ios
        script: xcode-project use-profiles
      - name: Build IPA
        working_directory: ios
        script: |
          xcode-project build-ipa --project awmouse.xcodeproj --scheme awmouse
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        # Reuses the `awmouse` integration above; no second key to manage.
        auth: integration
        # Uploads, waits for App Store Connect to finish processing, then
        # makes the build available to internal testers — anyone with a role
        # on the app in App Store Connect. External testers need a named
        # group here, and their first build goes through beta review:
        #
        #   beta_groups:
        #     - Friends
        submit_to_testflight: true
