name: awmouse
options:
  bundleIdPrefix: space.keybo
  deploymentTarget:
    iOS: "17.0"
    # 11.0 for SpatialEventGesture, which is the only way to count fingers on
    # a watch. Nothing is lost: the Go tunnel is arm64 only, so this app
    # already installs solely on watches that shipped with 10 and take 11.
    watchOS: "11.0"
  createIntermediateGroups: true

# Signing identity lives here rather than in this file so that a personal team
# ID stays out of git, and outside the generated .xcodeproj so that regenerating
# cannot wipe it. Run `make` in this directory: it seeds the file from the
# example if missing, then regenerates.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

packages:
  MotionInput:
    path: ../shared/MotionInput
  WatchBridge:
    path: ../shared/WatchBridge

targets:
  awmouse:
    type: application
    platform: iOS
    sources:
      - awmouse
    dependencies:
      - package: MotionInput
      - package: WatchBridge
      # The Go tunnel, bound by `make tunnel`. Static, so not embedded.
      - framework: Frameworks/Awmtunnel.xcframework
        embed: false
      # The watch app ships inside the phone app, in the folder the installer
      # looks in. It is not independent: it reaches the host by talking to the
      # phone, which is the only side that can run the Go tunnel.
      - target: awmouse-watch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.keybo.awmouse
        MARKETING_VERSION: "0.3"
        # TestFlight rejects an upload whose build number it has already seen,
        # so this must rise on every upload. Codemagic sets BUILD_NUMBER to its
        # per-app run counter; the Makefile defaults it to 1 for local builds.
        CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # Xcode 26 refuses to resolve a run destination without this; XcodeGen's
        # `platform: iOS` alone only emits SDKROOT.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # App Store Connect refuses any upload without an icon in an asset
        # catalog, and this is what makes Xcode compile the catalog's AppIcon
        # set and write CFBundleIconName. The icon itself is a placeholder —
        # a single 1024² opaque PNG; Xcode derives the other sizes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A real device is required for meaningful testing: dragging on the
        # simulator is mouse-driven, which tells you nothing about trackpad feel.
        CODE_SIGN_STYLE: Automatic
    info:
      path: awmouse/Info.plist
      properties:
        # XcodeGen writes literal "1.0" and "1" here unless told otherwise,
        # and nothing then reads MARKETING_VERSION or CURRENT_PROJECT_VERSION
        # — so the build number set above never reached the .ipa, and every
        # TestFlight upload after the first would collide. Pointing the keys
        # at the build settings is what makes those settings mean anything.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # iOS 14+ gates LAN connections behind a user prompt. Without this key
        # the app is killed on first connect rather than merely denied.
        NSLocalNetworkUsageDescription: >-
          awmouse connects to the helper running on your computer to move its
          cursor.

        # The QR on the computer is the only way to pair.
        NSCameraUsageDescription: >-
          awmouse scans the QR code shown by awmouse on your computer to pair
          with it.

        # Raw gyroscope access through CMMotionManager works without this, but
        # Apple asks for it wherever motion data is read and review expects it.
        NSMotionUsageDescription: >-
          awmouse reads device rotation so you can aim the cursor by tilting
          your phone.

        # Export compliance. The app ships WireGuard (through tailcat), so it
        # does use encryption; this declares that the encryption is the exempt
        # kind — standard, published algorithms (ChaCha20-Poly1305, Curve25519)
        # used for a standard protocol. Without the key, every TestFlight build
        # sits at "Missing Compliance" until the same question is answered by
        # hand in App Store Connect. A US-based developer may still owe an
        # annual self-classification report to BIS; that is a legal question,
        # not a build one.
        ITSAppUsesNonExemptEncryption: false

        # Handoff from the watch. iOS will not relaunch an app the user
        # swiped away, so the watch advertises this instead and the phone
        # offers it on the lock screen — one tap rather than a dead end.
        NSUserActivityTypes:
          - space.keybo.awmouse.control

        # Lets the QR code deep-link straight into the app from the stock
        # Camera app, instead of requiring the in-app scanner first.
        CFBundleURLTypes:
          - CFBundleURLName: space.keybo.awmouse.pair
            CFBundleURLSchemes:
              - awmouse

  awmouse-watch:
    type: application
    platform: watchOS
    sources:
      - watch
    dependencies:
      # No MotionInput: the watch reads no sensor. Its face is a trackpad and
      # its crown is a scroll wheel, and both are plain touch input.
      - package: WatchBridge
      - framework: Frameworks/Awmtunnel.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.keybo.awmouse.watchkitapp
        # arm64 only. Go has no arm64_32 backend, so the tunnel exists for the
        # 64-bit watches alone — Series 9, Ultra 2 and later.
        ARCHS: arm64
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
        # A watch app has no icon catalog of its own yet; without this Xcode
        # looks for one named AppIcon and warns on every build.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: watch/Info.plist
      properties:
        # watchOS 7 and later: one target, declared with WKApplication rather
        # than the old WatchKit extension pair.
        WKApplication: true
        WKCompanionAppBundleIdentifier: space.keybo.awmouse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The other half of the Handoff pair; both must declare it.
        NSUserActivityTypes:
          - space.keybo.awmouse.control
